name: Unit + Integration Tests

on:
  push:
    branches: [main, develop, "week*-*", "sprint/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + Integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 2026-11-09: was `pip install "pydantic>=2.10"` only. With that, the
      # smoke runner could not import revoluzen_flow.api.security_headers
      # (its package __init__ pulls in every router, hence fastapi) and
      # printed "SKIP (optional)" while the job stayed green. The job now
      # installs the real backend requirements, the same set the
      # "Security headers" job in security-scan.yml installs, and the
      # runner treats every module as required, so a skip is a failure.
      - name: Install backend requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke suite
        working-directory: backend
        run: python run_all_tests.py --fast
        env:
          REVOLUZEN_FLOW_ENV: ci
          PYTHONIOENCODING: utf-8

  frontend:
    name: Frontend Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci`, not `npm install`: the lockfile is what we audit and what
      # Dependabot reports on, so CI has to run exactly it.
      - name: Install
        working-directory: frontend
        run: npm ci

      # The "Install test deps" step that used to sit here force-installed
      # `vitest@^2 @vitest/coverage-v8@^2 jsdom @testing-library/*` with
      # --no-save, on top of the install above. Every one of those is already
      # a devDependency, so the step did nothing except pin CI to a version
      # range the repo had moved off — which is how CI kept running vitest 2
      # (CVE-2026-47429, plus tinypool 1.x RCE advisories) after package.json
      # said otherwise. Removed 2026-10-26; CI now tests what the lockfile
      # actually resolves. Coverage is not run here, so @vitest/coverage-v8
      # is not needed.

      - name: Run Vitest
        working-directory: frontend
        run: npx vitest run --passWithNoTests
