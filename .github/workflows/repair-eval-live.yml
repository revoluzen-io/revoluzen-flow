name: Repair evaluation (live model)

# Scores a real model on the repair suite. On demand only, because each run spends
# the provider's money. It uses the same provider settings as the product, so any
# model works: set the secret for your provider and pass the model id.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id, passed to the product as AI_MODEL
        required: true
        type: string
      suite:
        description: regression, the cases the product was built against, or fresh, cases no fix has been made from
        required: true
        default: regression
        type: choice
        options:
          - regression
          - fresh

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Score the model
        working-directory: backend
        env:
          REVOLUZEN_FLOW_MODE: dev
          AI_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.EVAL_OPENROUTER_API_KEY }}
        run: |
          # Report the scores without failing the job: a low score is the result.
          python -m revoluzen_flow.eval.repair --suite "${{ inputs.suite }}" --provider live --gate \
            --record "$RUNNER_TEMP/cassette.json" --out "$RUNNER_TEMP/report.json" \
            --md "$RUNNER_TEMP/report.md" || true
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the scorecard and recording
        uses: actions/upload-artifact@v4
        with:
          name: repair-eval-live
          path: |
            ${{ runner.temp }}/cassette.json
            ${{ runner.temp }}/report.json
            ${{ runner.temp }}/report.md
