name: Request-to-pipeline accuracy (live model)

# Scores a real model on the request-to-pipeline cases
# (backend/revoluzen_flow/eval/intent). On demand only, because each run spends
# the provider's money. Uses the same provider settings as the product, so any
# model works: set the secret for your provider and pass the model id.
#
# The run keeps each draft the model made. Commit that file under
# backend/revoluzen_flow/eval/intent/recorded/ and every release scores those
# drafts again without a model (release.yml, intent-eval job).
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id, passed to the product as AI_MODEL
        required: true
        type: string

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Score the model
        working-directory: backend
        env:
          REVOLUZEN_FLOW_MODE: dev
          REVOLUZEN_FLOW_DATA_DIR: ${{ runner.temp }}/data
          AI_MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.EVAL_OPENROUTER_API_KEY }}
        run: |
          # Report the score without failing the job: a low score is the result.
          python -m revoluzen_flow.eval.intent --drafter live \
            --record "$RUNNER_TEMP/intent-drafts.json" --out "$RUNNER_TEMP/intent-report.json" \
            --md "$RUNNER_TEMP/intent-report.md" || true
          cat "$RUNNER_TEMP/intent-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the drafts and the scorecard
        uses: actions/upload-artifact@v7
        with:
          name: intent-eval-live
          path: |
            ${{ runner.temp }}/intent-drafts.json
            ${{ runner.temp }}/intent-report.json
            ${{ runner.temp }}/intent-report.md
