name: Playwright E2E

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC, after nightly soak starts
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/revoluzen_flow/api/**"
      - "backend/revoluzen_flow/auth/**"
      - "backend/revoluzen_flow/plus/**"
  workflow_dispatch: {}

jobs:
  playwright:
    name: E2E — auth + authenticated page-render smoke + author surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          # 2026-06-01: setup-node looks for the lockfile in the repo
          # root by default, but ours lives at frontend/package-lock.json.
          # Without this path hint the action fails with
          # "Dependencies lock file is not found" and the whole job
          # dies in ~18s before any tests run. See cache docs:
          # https://github.com/actions/setup-node#caching-global-packages-data
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        # pyproject.toml lives at the repo ROOT, not backend/. Installing
        # from backend/ fails instantly with "neither setup.py nor
        # pyproject.toml found" - the long-standing ~18s nightly failure.
        # Install from the repo root instead.
        run: pip install -e .

      - name: Start backend (with dev-seeded test users)
        working-directory: backend
        run: |
          mkdir -p /tmp/revoluzen-flow-e2e
          # REVOLUZEN_FLOW_BOOTSTRAP_ADMIN=1: auto-seed admin@revoluzen.local for the E2E
          # suite. Production defaults to NO auto-seed (the operator creates the
          # admin on first launch); this is the headless/CI opt-in, and the next
          # step reads the generated INITIAL_ADMIN_PASSWORD.txt.
          REVOLUZEN_FLOW_DATA_DIR=/tmp/revoluzen-flow-e2e REVOLUZEN_FLOW_BOOTSTRAP_ADMIN=1 \
            python -m uvicorn revoluzen_flow.main:app --host 0.0.0.0 --port 8001 \
            > /tmp/revoluzen-flow.log 2>&1 &
          for i in {1..60}; do
            curl -sf http://localhost:8001/api/health > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/revoluzen-flow.log
          exit 1

      - name: Extract bootstrap admin password
        run: |
          # The E2E suite logs in programmatically as the bootstrap admin
          # (created on first backend start) and injects the session into
          # localStorage — no separate seed script needed. Pull the generated
          # password out of the data dir and mask it in the logs.
          PWFILE=$(find /tmp/revoluzen-flow-e2e -name INITIAL_ADMIN_PASSWORD.txt | head -1)
          if [ -z "$PWFILE" ]; then echo "bootstrap password file not found under /tmp/revoluzen-flow-e2e"; exit 1; fi
          PW=$(grep -m1 'password:' "$PWFILE" | awk '{print $2}')
          echo "::add-mask::$PW"
          echo "REVOLUZEN_FLOW_E2E_EMAIL=admin@revoluzen.local" >> "$GITHUB_ENV"
          echo "REVOLUZEN_FLOW_E2E_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm install
          npm install --save-dev @playwright/test
          npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev > /tmp/frontend.log 2>&1 &
          for i in {1..60}; do
            curl -sf http://localhost:5174 > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/frontend.log
          exit 1

      - name: Run Playwright specs
        working-directory: frontend
        env:
          REVOLUZEN_FLOW_URL: http://localhost:5174
          NO_SERVER: "1"   # dev server already running
        run: npx playwright test

      - name: Popover placement sweep
        working-directory: frontend
        env:
          REVOLUZEN_FLOW_URL: http://localhost:5174
          # 1280,900,768 by default. 768 is the one that matters: at the two
          # wider sizes every panel measured clean while the notifications
          # panel was starting 210px off the left edge at 768 and the account
          # menu 62px off.
          REVOLUZEN_FLOW_WIDTHS: "1280,900,768"
        # Opens every menu-ish trigger on every page and fails if a panel
        # leaves the viewport. The specs above are the named regression guard
        # for four controls; this is the breadth net (~350 triggers).
        #
        # It must run AFTER the specs and from `frontend`: global-setup writes
        # the saved session to the RELATIVE path e2e/.auth/state.json, so it
        # lands next to whatever cwd Playwright was launched from, and
        # storageState is origin-scoped — a state file from another origin
        # loads without error and grants nothing. The sweep then crawls the
        # login page, opens nothing, and would report success. It now refuses
        # to pass when it is signed out or opens zero triggers, but keeping
        # the cwd aligned is what makes it actually test something.
        run: npm run check:popovers

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/revoluzen-flow.log
