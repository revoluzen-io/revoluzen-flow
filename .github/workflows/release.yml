name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual path for publishing a SUFFIXED version to PyPI without cutting a
  # release — e.g. `1.0.0.dev0` to reserve the project name while leaving the
  # real `1.0.0` unspent. PyPI refuses re-uploads, so a version is a one-shot
  # resource: once `1.0.0` is up (broken or not) it can only be yanked, never
  # replaced. Reserving with a .devN keeps the launch version free.
  #
  # Deliberately reuses this workflow rather than a parallel one, so the
  # reservation goes through the SAME build → stage → verify → publish path a
  # real release does. A separate workflow would drift from it.
  #
  # The package gate and `pypi` job run on dispatch: no git tag exists, so there is no
  # GitHub release to cut and no image tag to derive.
  workflow_dispatch:
    inputs:
      version_suffix:
        description: "Suffix to publish instead of a release, e.g. dev0 -> 1.0.0.dev0. Required — a blank value would publish the real version."
        required: true
        default: "dev0"

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: Validate distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Stage and validate assets
        run: |
          python scripts/stage_frontend.py
          python scripts/stage_docs.py
          python tools/package_preflight.py --strict
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os,tomllib; assert os.environ['GITHUB_REF_NAME'] == 'v' + tomllib.load(open('pyproject.toml','rb'))['project']['version']"
      - name: Build and inspect distribution
        run: |
          python -m pip install build
          python -m build
          python tools/verify_wheel.py dist/*.whl
      - name: Install and boot wheel outside checkout
        run: |
          python -m venv /tmp/revoluzen-flow-release
          /tmp/revoluzen-flow-release/bin/python -m pip install dist/*.whl psutil
          /tmp/revoluzen-flow-release/bin/python tools/smoke_distribution.py --python /tmp/revoluzen-flow-release/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*
          if-no-files-found: error

  # 2026-11-11: request-to-pipeline accuracy (backend/revoluzen_flow/eval/intent).
  # Each request is drafted, the draft runs on the case's files, and its rows
  # are compared with the expected rows. The release and PyPI jobs wait for it.
  intent-eval:
    name: Request-to-pipeline accuracy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # The rule planner needs no model, so it is scored on every release.
      # Below the floor the release stops; raise the floor when the planner
      # gets better (the case list is in eval/intent/cases.py).
      - name: Score the rule planner
        working-directory: backend
        env:
          REVOLUZEN_FLOW_DATA_DIR: ${{ runner.temp }}/data
        run: |
          set +e
          python -m revoluzen_flow.eval.intent --drafter rule --min-accuracy 0.8 --md "$RUNNER_TEMP/intent-rule.md"
          status=$?
          cat "$RUNNER_TEMP/intent-rule.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      # Drafts a live model made (intent-eval-live.yml) and someone committed
      # under eval/intent/recorded/, scored again on this release's code with
      # no model: a change after the model that breaks them shows here.
      - name: Score recorded model drafts
        working-directory: backend
        env:
          REVOLUZEN_FLOW_DATA_DIR: ${{ runner.temp }}/data
        run: |
          shopt -s nullglob
          for f in revoluzen_flow/eval/intent/recorded/*.json; do
            python -m revoluzen_flow.eval.intent --drafter replay --replay "$f" --md "$RUNNER_TEMP/replay.md" || true
            echo "### Recorded drafts: $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/replay.md" >> "$GITHUB_STEP_SUMMARY"
          done

  docker:
    needs: package
    name: Publish Docker image
    runs-on: ubuntu-latest
    # 2026-07-15: gated off. Repository SECRETS do not travel with code, so
    # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN did not come across when this moved to
    # the revoluzen org — every tag push then died on "Username and password
    # required" at the login step. Nothing was lost: the v1.0.0 image was never
    # published, and the README already tells users the image builds locally on
    # first `docker compose up`. A job that always fails is worse than one that
    # honestly reports "not configured".
    #
    # To enable (no code change): add the DOCKERHUB_USERNAME + DOCKERHUB_TOKEN
    # secrets, then set repository variable PUBLISH_DOCKER=true under
    # Settings → Secrets and variables → Actions → Variables. Drop the
    # README "builds locally on first run" heads-up in the same change.
    # Tag pushes only: the image tag is derived from GITHUB_REF_NAME, which on
    # a manual dispatch is the branch, not a version.
    if: ${{ vars.PUBLISH_DOCKER == 'true' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            revoluzen/flow:latest
            revoluzen/flow:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  linux-installers:
    name: Build Linux installers (.deb / .rpm / .AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Tag pushes only — these are release artifacts.
    if: ${{ github.event_name == 'push' }}
    # UNSIGNED, deliberately. installer/readme.md's rule is "we don't ship
    # unsigned binaries to end users", and that rule is why Windows (.exe) and
    # macOS (.pkg) are NOT built here: without an EV cert Windows SmartScreen
    # shows a red block-dialog, and without Developer ID + notarization macOS
    # Gatekeeper refuses to open the package at all — the non-technical user
    # these installers exist for is exactly who gets stopped. An unsigned Linux
    # package is different in kind: apt/dnf warn, the user decides, and
    # installing from a trusted source is the normal path. Add signing (and
    # then Windows/macOS) when the certs exist; see installer/readme.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tooling
        run: |
          sudo apt-get update -qq
          # dpkg-dev + fakeroot -> .deb ; rpm -> .rpm ; file + desktop-file-utils
          # are what appimagetool shells out to; libfuse2 is what the AppImage
          # runtime itself needs to execute on the runner.
          sudo apt-get install -y -qq dpkg-dev fakeroot rpm file desktop-file-utils libfuse2

      - name: Install appimagetool
        # build-appimage.sh expects `appimagetool` on PATH — it's not an apt
        # package, it ships as an AppImage from AppImageKit. Extracted rather
        # than run directly: FUSE is unreliable on CI runners, and
        # --appimage-extract-and-run avoids needing it at all.
        run: |
          cd /tmp
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
          appimagetool --version || APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - name: Create the .venv the build scripts expect
        # The scripts hardcode <repo>/.venv/bin/python and need PyInstaller,
        # which is NOT a project dependency (it's build-time only, so it stays
        # out of pyproject deliberately — end users never freeze anything).
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet pyinstaller
          ./.venv/bin/pip install --quiet -e .

      - name: Build .deb
        run: ./installer/linux/build-deb.sh

      - name: Build .rpm
        run: ./installer/linux/build-rpm.sh

      - name: Build .AppImage
        # APPIMAGE_EXTRACT_AND_RUN: appimagetool is itself an AppImage and
        # needs FUSE to self-mount, which GitHub runners don't reliably
        # provide. This tells it to extract and run instead.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./installer/linux/build-appimage.sh

      - name: Prove the .deb installs and serves the UI
        # The build scripts already refuse to package a bundle with no UI. This
        # goes further: install the actual artifact and load the page. Every
        # packaging path in this project has shipped a blank UI at least once
        # because nobody opened the artifact — so we open it.
        run: |
          sudo apt-get install -y ./installer/linux/output/revoluzen_flow_*_amd64.deb
          command -v revoluzen || { echo "::error::revoluzen not on PATH after .deb install"; exit 1; }

          REVOLUZEN_FLOW_DATA_DIR=/tmp/revoluzen-flow-deb REVOLUZEN_FLOW_MODE=dev \
            revoluzen serve --no-open --port 8201 > /tmp/deb.log 2>&1 &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:8201/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8201/api/health > /dev/null \
            || { echo "::error::the installed .deb never came up"; cat /tmp/deb.log; exit 1; }

          code=$(curl -s -o /tmp/i.html -w '%{http_code}' http://127.0.0.1:8201/)
          [ "$code" = "200" ] || { echo "::error::GET / returned $code — the .deb serves no UI"; cat /tmp/deb.log; exit 1; }
          grep -q 'id="root"' /tmp/i.html || { echo "::error::/ is not the SPA"; exit 1; }
          for a in $(grep -oE '/assets/[^"]+' /tmp/i.html | sort -u); do
            ac=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8201$a")
            [ "$ac" = "200" ] || { echo "::error::asset $a -> $ac"; exit 1; }
            echo "  ok $a"
          done
          echo "the installed .deb serves the real UI"

      - name: Prove the .rpm installs and serves the UI (Fedora container)
        # Runner is Ubuntu, so test the .rpm on its real target OS in a Fedora
        # container: install the actual artifact with dnf, boot it, load the
        # page — same "open the artifact" rigor as the .deb above.
        run: |
          docker run --rm -v "$PWD/installer/linux/output:/pkgs:ro" fedora:40 bash -euo pipefail -c '
            dnf install -y -q /pkgs/revoluzen-flow-*.x86_64.rpm
            command -v revoluzen || { echo "::error::revoluzen not on PATH after .rpm install"; exit 1; }
            REVOLUZEN_FLOW_DATA_DIR=/tmp/revoluzen-flow-rpm REVOLUZEN_FLOW_MODE=dev revoluzen serve --no-open --port 8202 >/tmp/rpm.log 2>&1 &
            for i in $(seq 1 45); do curl -sf http://127.0.0.1:8202/api/health >/dev/null && break; sleep 2; done
            curl -sf http://127.0.0.1:8202/api/health >/dev/null || { echo "::error::the installed .rpm never came up"; cat /tmp/rpm.log; exit 1; }
            code=$(curl -s -o /tmp/r.html -w "%{http_code}" http://127.0.0.1:8202/)
            [ "$code" = "200" ] || { echo "::error::.rpm GET / -> $code"; cat /tmp/rpm.log; exit 1; }
            grep -q "id=\"root\"" /tmp/r.html || { echo "::error::.rpm serves no SPA"; exit 1; }
            echo "the installed .rpm serves the real UI"
          '

      - name: Prove the .AppImage runs and serves the UI
        # AppRun hardcodes `revoluzen serve` and appends "$@", so pass only flags.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          APP=$(ls installer/linux/output/RevoluzenFlow-*.AppImage | head -1)
          chmod +x "$APP"
          REVOLUZEN_FLOW_DATA_DIR=/tmp/revoluzen-flow-appimage REVOLUZEN_FLOW_MODE=dev \
            "$APP" --no-open --port 8203 > /tmp/appimage.log 2>&1 &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:8203/api/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:8203/api/health >/dev/null \
            || { echo "::error::the .AppImage never came up"; cat /tmp/appimage.log; exit 1; }
          code=$(curl -s -o /tmp/ai.html -w '%{http_code}' http://127.0.0.1:8203/)
          [ "$code" = "200" ] || { echo "::error::.AppImage GET / -> $code"; cat /tmp/appimage.log; exit 1; }
          grep -q 'id="root"' /tmp/ai.html || { echo "::error::.AppImage serves no SPA"; exit 1; }
          echo "the .AppImage serves the real UI"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: installer/linux/output/*
          retention-days: 14

  # ── Windows / macOS: BUILT AND PROVEN, NOT PUBLISHED ────────────────────
  # These two jobs exist to stop the installers rotting. They are not in the
  # release's `files:` list and deliberately so: unsigned, Windows SmartScreen
  # shows a red block dialog and macOS Gatekeeper refuses to open the package
  # at all, which stops exactly the non-technical user these installers are
  # for. That rule is in installer/readme.md and it has not changed.
  #
  # What HAS changed is that "we don't publish it" had quietly become "nobody
  # ever builds it", and both scripts broke without anyone noticing: a rebrand
  # find/replace left `--collect-all revoluzen-flow` in them, which is not an
  # importable name, so PyInstaller warned and bundled none of the app's data
  # files. The macOS launcher also pointed at a binary name that never existed.
  # Building on every tag means the next such break is a red check, not a
  # discovery made the day signing certificates finally arrive.
  windows-installer:
    name: Windows freeze (build + smoke, not published)
    runs-on: windows-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pywebview
          python -m pip install -e .

      - name: Build the portable executable
        # build-portable.ps1 chains the whole pipeline: npm build, frontend and
        # docs staging, package_preflight --strict, PyInstaller against the
        # shared spec, then smoke_distribution.py against the built exe.
        shell: pwsh
        run: ./installer/windows/build-portable.ps1

      - name: Prove the freeze carries the app, not just the runtime
        # The failure this guards is specific: with a mis-spelled package name
        # PyInstaller still produces a working Python that serves nothing.
        shell: pwsh
        run: |
          python -m PyInstaller installer/windows/revoluzen-flow.spec `
            --noconfirm --clean --distpath dist --workpath build/pyi
          $root = "dist/revoluzen-flow/_internal/revoluzen_flow"
          foreach ($p in @("connectors/manifests", "frontend_dist", "seed_data")) {
            $n = (Get-ChildItem "$root/$p" -Recurse -File -ErrorAction SilentlyContinue).Count
            if ($n -lt 1) { Write-Host "::error::bundle is missing $p"; exit 1 }
            Write-Host "  ok $p ($n files)"
          }
          ./dist/revoluzen-flow/revoluzen.exe selftest

      - uses: actions/upload-artifact@v4
        with:
          name: windows-freeze-unsigned
          path: dist/portable/revoluzen.exe
          if-no-files-found: error

  macos-installer:
    name: macOS .pkg (build + smoke, not published)
    runs-on: macos-latest
    timeout-minutes: 45
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create the .venv build.sh expects
        run: |
          python -m venv .venv
          ./.venv/bin/pip install --quiet --upgrade pip
          ./.venv/bin/pip install --quiet pyinstaller
          ./.venv/bin/pip install --quiet -e .

      - name: Build the .pkg
        # build.sh self-checks: it runs package_preflight --strict, asserts the
        # frozen binary exists at the path the .app launcher uses, and runs its
        # selftest before pkgbuild. An unsigned build is expected here.
        run: ./installer/macos/build.sh

      - name: Prove the .pkg is real and carries the app
        run: |
          pkg=$(ls installer/macos/output/*.pkg)
          echo "built $pkg ($(du -h "$pkg" | cut -f1))"
          pkgutil --check-signature "$pkg" || echo "unsigned, as expected"
          # Expand rather than install: the runner's own Python must not be
          # shadowed, and expansion still proves the payload's shape.
          pkgutil --expand-full "$pkg" /tmp/pkg-expanded
          app=$(find /tmp/pkg-expanded -name RevoluzenFlow.app -maxdepth 4 | head -n1)
          [ -n "$app" ] || { echo "::error::no RevoluzenFlow.app in the payload"; exit 1; }
          res="$app/Contents/Resources/revoluzen-flow/_internal/revoluzen_flow"
          for p in connectors/manifests frontend_dist seed_data; do
            n=$(find "$res/$p" -type f 2>/dev/null | wc -l | tr -d ' ')
            [ "$n" -ge 1 ] || { echo "::error::bundle is missing $p"; exit 1; }
            echo "  ok $p ($n files)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg-unsigned
          path: installer/macos/output/*.pkg
          if-no-files-found: error

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    # Tag pushes only: there is no release to cut for a .devN reservation, and
    # the version is read from GITHUB_REF_NAME which would be a branch here.
    if: ${{ github.event_name == 'push' }}
    needs: [package, linux-installers, intent-eval]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the built installers
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: dist-installers

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract section from CHANGELOG
        id: changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { f=1; next }
            f && $0 ~ "^## \\[" { exit }
            f { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release_notes.md
          fi

      - name: Checksums
        # Users can't verify an unsigned package's authenticity, but they can
        # verify it downloaded intact. Cheap, and expected of a release.
        run: |
          cd dist-installers
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Revoluzen Flow ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          # Without `files:` the release carries source tarballs only — which
          # is how v1.0.0 came to be tagged while the README offered five
          # installer downloads that did not exist.
          fail_on_unmatched_files: true
          files: |
            dist-installers/*.deb
            dist-installers/*.rpm
            dist-installers/*.AppImage
            dist-installers/SHA256SUMS

  pypi:
    needs: [package, intent-eval]
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # 2026-07-16: wired up and ready — the job is correct, it just needs the
    # PyPI side configured before it can run. This matters more than it looks:
    # README's headline install is `pip install revoluzen-flow`, and the package is NOT
    # on PyPI, so that command fails for every reader until this publishes. The
    # name `revoluzen-flow` was still unclaimed as of 2026-10-30.
    #
    # To enable (no code change):
    #   1. On pypi.org register a pending publisher for the project name the
    #      wheel declares — `revoluzen-flow` from [project] name in
    #      pyproject.toml, NOT the brand `revoluzen`. This comment said
    #      `revoluzen` until 2026-10-30; registering the brand is rejected
    #      with `invalid-publisher` before any bytes are uploaded, and the
    #      error does not say which field is wrong. Full form in RELEASING.md.
    #      owner=revoluzen-io, repo=revoluzen-flow, workflow=release.yml, environment=(none).
    #      Trusted publishing uses the OIDC `id-token: write` below — there is
    #      no API token to store or rotate. Do NOT add a token secret instead.
    #   2. Set repository variable PUBLISH_PYPI=true
    #      (Settings → Secrets and variables → Actions → Variables).
    #   3. Push the version tag. PyPI refuses re-uploads of an existing
    #      version, so a given tag publishes exactly once.
    #
    # Gated rather than `if: true` so an unconfigured PyPI leaves the release
    # green (job skips) instead of failing every tag push — the trap the
    # docker job fell into.
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard — the tag must match the version being published
        # On a TAG push the published version comes from pyproject.toml, not the
        # tag name. If they drift — e.g. you tag v1.0.1 but pyproject still says
        # 1.0.0 — PyPI is handed 1.0.0 again (a hard "file already exists" error
        # that burns the run) while the GitHub release advertises 1.0.1. Catch it
        # before anything is built. Suffixed reservation runs (workflow_dispatch)
        # publish a deliberately non-tag version, so this check is push-only.
        if: ${{ github.event_name == 'push' }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import re,pathlib; print(re.search(r'(?m)^version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text()).group(1))")
          echo "tag=$tag  pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match pyproject version $proj. Bump pyproject.toml (and CHANGELOG) to match the tag, or retag — refusing to publish a mismatched version."
            exit 1
          fi

      - name: Apply the version suffix (manual reservation runs only)
        # Rewrites the version for THIS BUILD only; the repo is untouched.
        # Guarded: a manual dispatch with a blank suffix would publish the real
        # version and burn it, which is the exact outcome this path exists to
        # avoid. Tag pushes skip this entirely and publish pyproject's version.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SUFFIX: ${{ inputs.version_suffix }}
        run: |
          if [ -z "$SUFFIX" ]; then
            echo "::error::version_suffix is empty. A manual run publishes a suffixed version (e.g. dev0); to publish the real version, push a tag."
            exit 1
          fi
          python - <<'PY'
          import os, re, pathlib
          suffix = os.environ["SUFFIX"]
          p = pathlib.Path("pyproject.toml")
          s = p.read_text(encoding="utf-8")
          new, n = re.subn(
              r'(?m)^version = "([^"]+)"',
              lambda m: f'version = "{m.group(1)}.{suffix}"',
              s, count=1,
          )
          if n != 1:
              raise SystemExit("could not rewrite the version in pyproject.toml")
          p.write_text(new, encoding="utf-8")
          print(re.search(r'(?m)^version = ".*"', new).group(0))
          PY

      # The UI must be built and staged INTO the package before the wheel is
      # built. revoluzen-flow is one pip package that serves its own React app; the
      # app builds to frontend/dist, which is outside the Python package, so
      # setuptools cannot see it. Skip these two steps and the wheel still
      # builds — silently, with no UI — which is exactly what 1.0.0 shipped.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Stage the frontend into the package
        # Fails hard if frontend/dist is missing, so a UI-less wheel can never
        # reach PyPI. Do not soften this to a warning.
        run: python scripts/stage_frontend.py

      - name: Stage docs into the package
        # Fails hard if docs/ is missing, so Help -> Documentation and product
        # knowledge cannot disappear from pip installs.
        run: python scripts/stage_docs.py

      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build

      - name: Verify the wheel actually contains the app
        # Last line of defence: assert the artifact's contents before it is
        # published. PyPI refuses re-uploads, so a bad wheel cannot be fixed
        # in place — only yanked and re-released under a new version.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          checks = {
              "frontend index.html": any(n.endswith("revoluzen_flow/frontend_dist/index.html") for n in names),
              "frontend assets":     any("/frontend_dist/assets/" in n for n in names),
              "connector manifests": len([n for n in names if "/connectors/manifests/" in n and n.endswith(".json")]) >= 40,
              "swagger-ui assets":   any("/static/swagger-ui/" in n for n in names),
              "help docs":           any(n.endswith("revoluzen_flow/docs/quickstart.md") for n in names),
              "product facts":       any("/docs/product_facts/" in n for n in names),
          }
          for label, ok in checks.items():
              print(f"  {'OK  ' if ok else 'FAIL'}  {label}")
          if not all(checks.values()):
              sys.exit("wheel is missing required content — refusing to publish")
          print(f"{wheel}: {len(names)} files, all checks passed")
          PY

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
